name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные выкладки не нужны: важна последняя.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Настроить Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Собрать статику
        env:
          # Свой домен — сайт лежит в корне, подпути больше нет.
          # NEXT_PUBLIC_SITE_URL тоже не задаётся: боевой адрес живёт
          # в src/data/site.ts и оттуда же идёт в canonical, OG и sitemap.
          #
          # Приёмник заявок. Пустая строка — форма уступает место Telegram.
          # На Pages нет PHP, поэтому адрес лежит в переменной репозитория:
          # Settings → Secrets and variables → Actions → Variables,
          # имя LEAD_ENDPOINT, значение — адрес Cloudflare Worker
          # (см. workers/lead.js). Пока переменной нет — пустая строка.
          NEXT_PUBLIC_LEAD_ENDPOINT: ${{ vars.LEAD_ENDPOINT }}
        run: npm run build

      - name: Не отдавать сборку Jekyll
        # без этого файла Jekyll выкинет каталог _next целиком
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
