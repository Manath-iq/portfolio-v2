name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные выкладки не нужны: важна последняя.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Настроить Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Переменных окружения здесь нет намеренно. Свой домен — сайт лежит
      # в корне, подпуть не нужен; боевой адрес, счётчик Метрики и приёмник
      # заявок живут в src/data/site.ts. Одно место вместо двух: переменная
      # репозитория — лишнее звено, о котором легко забыть, и тогда сборка
      # молча уезжает без формы.
      - name: Собрать статику
        run: npm run build

      - name: Не отдавать сборку Jekyll
        # без этого файла Jekyll выкинет каталог _next целиком
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
