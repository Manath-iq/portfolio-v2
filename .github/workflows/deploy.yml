name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные выкладки не нужны: важна последняя.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Настроить Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Собрать статику
        env:
          # На Pages проектный сайт открывается по подпути /portfolio-v2/.
          NEXT_PUBLIC_BASE_PATH: /portfolio-v2
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # PHP на Pages нет — форма честно уступает место Telegram.
          NEXT_PUBLIC_LEAD_ENDPOINT: ''
        run: npm run build

      - name: Не отдавать сборку Jekyll
        # без этого файла Jekyll выкинет каталог _next целиком
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
